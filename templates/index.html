<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Find Nearest MBTA Station</title>
</head>
<body>
  <h1>MBTA Finder</h1>
  <p>Find the nearest MBTA station to any location near Boston.</p>

  <form action="/station" method="POST">
    <label for="place_name">Enter a location:</label><br>
    <input type="text" id="place_name" name="place_name" required><br><br>
    <input type="submit" value="Find Station">
  </form>
</body>
</html>
