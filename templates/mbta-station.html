<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Result</title>
</head>
<body>
  <h1>Nearest station to "{{ place }}"</h1>

  <p><strong>{{ station }}</strong></p>

  {% if wheelchair %}
    <p>✅ Wheelchair accessible</p>
  {% else %}
    <p>❌ Not wheelchair accessible</p>
  {% endif %}

  <p><a href="/">Search again</a></p>
</body>
</html>
